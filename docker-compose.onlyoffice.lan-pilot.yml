# Temporary office LAN pilot only. Keep docker-compose.onlyoffice.yml localhost-only for development.
services:
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    ports:
      - "${ONLYOFFICE_LAN_IP:?Set the development laptop LAN IPv4}:8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:?Set a fresh pilot secret}"
      JWT_HEADER: "Authorization"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    shm_size: "1gb"
    volumes:
      - onlyoffice-lan-pilot-data:/var/www/onlyoffice/Data
      - onlyoffice-lan-pilot-lib:/var/lib/onlyoffice
      - onlyoffice-lan-pilot-db:/var/lib/postgresql
      - onlyoffice-lan-pilot-logs:/var/log/onlyoffice
volumes:
  onlyoffice-lan-pilot-data:
  onlyoffice-lan-pilot-lib:
  onlyoffice-lan-pilot-db:
  onlyoffice-lan-pilot-logs:
